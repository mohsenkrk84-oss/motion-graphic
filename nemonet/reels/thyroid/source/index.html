<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Yekan;src:url(IRANYekanWebBold.ttf);font-weight:700}
@font-face{font-family:Yekan;src:url(IRANYekanWebRegular.ttf);font-weight:400}
@font-face{font-family:Hand;src:url(Marhey.ttf);font-weight:100 900}
html,body{margin:0;background:#000;overflow:hidden}
svg{display:block}
</style></head><body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="pencil" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="w"/>
    <feDisplacementMap in="SourceGraphic" in2="w" scale="4" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.9 0.25" numOctaves="2" seed="8" result="g"/>
    <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.85  0 0 0 0 0.85  0 0 0 -1.2 0.55" result="gr"/>
    <feComposite in="gr" in2="d" operator="in" result="gr2"/>
    <feMerge><feMergeNode in="d"/><feMergeNode in="gr2"/></feMerge>
  </filter>
  <filter id="paperF" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="21"/>
    <feDiffuseLighting lighting-color="#ffffff" surfaceScale="1.6" result="lit"><feDistantLight azimuth="45" elevation="62"/></feDiffuseLighting>
    <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  -0.35 0 0 0 0.35"/>
  </filter>
  <radialGradient id="vign" cx="50%" cy="45%" r="75%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".22"/></radialGradient>
  <clipPath id="lensClip"><circle cx="0" cy="0" r="230"/></clipPath>
</defs>
<rect width="1080" height="1920" fill="#D8D8D4"/>
<rect width="1080" height="1920" filter="url(#paperF)"/>
<g id="world"></g>
<rect width="1080" height="1920" fill="url(#vign)" pointer-events="none"/>
<g id="captions"></g>
</svg>
<script src="vendor/gsap.min.js"></script>
<script src="lib.js"></script>
<script src="stills.js"></script>
</body></html>
